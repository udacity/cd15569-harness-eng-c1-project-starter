[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-agent"
version = "0.1.0"
description = "An agent harness that maps an undocumented service and produces a cited ONBOARDING.md."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
onboarding-agent = "onboarding_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["onboarding_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits a real model endpoint; deselected by default",
]
addopts = "-m 'not live'"
